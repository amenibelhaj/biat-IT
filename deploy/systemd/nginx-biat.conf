# Installation sans Docker — configuration Nginx de la VM.
#
#   sudo cp nginx-biat.conf /etc/nginx/sites-available/biat
#   sudo ln -s /etc/nginx/sites-available/biat /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name biat-actifs.intranet.biat.com.tn;   # à adapter

    root /opt/biat-asset-management/biat-frontend/build;
    index index.html;

    client_max_body_size 20M;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy        "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

