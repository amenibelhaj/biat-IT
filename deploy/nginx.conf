server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;   # marge au-dessus de la limite d'import (10 Mo)

    # En-têtes de sécurité usuels.
    add_header X-Frame-Options         "SAMEORIGIN"        always;
    add_header X-Content-Type-Options  "nosniff"           always;
    add_header Referrer-Policy         "same-origin"       always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Les fichiers compilés portent une empreinte dans leur nom : ils peuvent
    # être mis en cache sans risque.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Relais vers l'API. L'interface appelle /api sur sa propre origine,
    # il n'y a donc aucune configuration CORS à prévoir.
    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;    # marge pour l'import de gros fichiers
    }

    # Application monopage : toute autre route renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
